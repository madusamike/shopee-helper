<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蝦皮分潤選品助手 WebApp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        shopee: {
                            DEFAULT: '#EE4D2D',
                            hover: '#D73211',
                            light: '#FFF0ED',
                            bg: '#F5F5F5'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .phone-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-radius: 36px;
            overflow: hidden;
            border: 8px solid #1c1c1e;
        }
        @media (max-width: 640px) {
            .phone-container {
                border: none;
                border-radius: 0;
                max-height: 100vh;
            }
        }
    </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen font-sans antialiased select-none">

    <!-- 手機容器 (9:16 Mobile Viewport) -->
    <div class="phone-container bg-shopee-bg flex flex-col relative text-slate-800">

        <!-- 1. 頂部狀態列與 Header -->
        <header class="bg-shopee text-white pt-3 pb-3 px-4 shadow-md z-20 flex-shrink-0">
            <div class="w-28 h-4 bg-black rounded-full mx-auto mb-2 opacity-20 sm:block hidden"></div>
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <h1 class="text-lg font-bold tracking-wide">蝦皮分潤選品助手</h1>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="toggle-subid-btn" class="text-xs bg-white/20 hover:bg-white/30 text-white px-2.5 py-1 rounded-full transition flex items-center gap-1">
                        <i class="fa-solid fa-id-card"></i> 編號: <span font-mono>16390210028</span>
                    </button>
                    <button id="reset-filters" class="text-xs bg-white/20 hover:bg-white/30 text-white px-2 py-1 rounded-full transition">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>

            <!-- 推廣者編號 / SubID 列 -->
            <div id="subid-bar" class="mt-2.5 pt-2 border-t border-white/20 flex items-center justify-between text-xs">
                <span class="font-medium text-amber-100 flex items-center gap-1">
                    <i class="fa-solid fa-user-tag"></i> 推廣者編號:
                </span>
                <div class="flex items-center gap-1.5 flex-1 max-w-[210px] ml-2">
                    <input type="text" id="subid-input" value="16390210028" placeholder="輸入推廣者編號..." 
                           class="w-full bg-white/20 text-white placeholder-white/60 px-2.5 py-1 rounded-lg border border-white/30 text-xs focus:bg-white focus:text-slate-800 focus:outline-none font-mono">
                    <button id="save-subid-btn" class="bg-amber-400 text-slate-900 font-bold px-2 py-1 rounded-lg text-[11px] whitespace-nowrap shadow hover:bg-amber-300">
                        儲存
                    </button>
                </div>
            </div>
        </header>

        <!-- 主要內容區域 -->
        <main class="flex-1 overflow-y-auto no-scrollbar pb-20">

            <!-- 2. 條件篩選區 -->
            <section class="bg-white p-4 shadow-sm mb-2 rounded-b-2xl">
                <!-- 搜尋框與直達分潤計畫 App 按鈕 -->
                <div class="flex gap-2 mb-3">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="搜尋商品名稱 (例：寵物推車)..." 
                               class="w-full bg-slate-100 text-sm pl-10 pr-3 py-2.5 rounded-xl border border-transparent focus:border-shopee focus:bg-white transition outline-none">
                    </div>
                    <button id="search-shopee-app-btn" class="bg-shopee hover:bg-shopee-hover text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow transition flex items-center gap-1 whitespace-nowrap active:scale-95">
                        <i class="fa-solid fa-bolt text-amber-300"></i> ⚡ 分潤計畫App
                    </button>
                </div>

                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider"><i class="fa-solid fa-sliders mr-1"></i> 多條件精準篩選</span>
                    <button id="toggle-filter-btn" class="text-xs text-shopee font-semibold flex items-center gap-1">
                        <span>進階選項</span> <i class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200" id="filter-arrow"></i>
                    </button>
                </div>

                <div id="filter-panel" class="space-y-3 pt-1 border-t border-slate-100">
                    <div>
                        <label class="text-xs text-slate-600 block mb-1">商品金額區間 ($)</label>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="min-price" placeholder="最低" class="w-full bg-slate-50 text-xs px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-shopee">
                            <span class="text-slate-400 text-xs">-</span>
                            <input type="number" id="max-price" placeholder="最高" class="w-full bg-slate-50 text-xs px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-shopee">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slate-600 block mb-1">最低分潤率 (%)</label>
                            <input type="number" id="min-rate" placeholder="例如：10" class="w-full bg-slate-50 text-xs px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-shopee">
                        </div>
                        <div>
                            <label class="text-xs text-slate-600 block mb-1">已售出數 (>=)</label>
                            <input type="number" id="min-sales" placeholder="例如：100" class="w-full bg-slate-50 text-xs px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-shopee">
                        </div>
                    </div>

                    <button id="apply-filter-btn" class="w-full bg-shopee hover:bg-shopee-hover text-white text-sm font-bold py-2.5 rounded-xl shadow-md transition active:scale-[0.98]">
                        <i class="fa-solid fa-filter mr-1.5"></i> 套用條件篩選
                    </button>
                </div>
            </section>

            <!-- 3. 分類頁籤 -->
            <section class="px-3 mb-2">
                <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1" id="category-tabs">
                    <button data-cat="all" class="cat-btn active bg-shopee text-white px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm">全部</button>
                    <button data-cat="pet" class="cat-btn bg-white text-slate-600 px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border border-slate-200">寵物用品</button>
                    <button data-cat="home" class="cat-btn bg-white text-slate-600 px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border border-slate-200">居家生活</button>
                    <button data-cat="beauty" class="cat-btn bg-white text-slate-600 px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border border-slate-200">美妝保養</button>
                    <button data-cat="appliance" class="cat-btn bg-white text-slate-600 px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border border-slate-200">家電影音</button>
                </div>
            </section>

            <!-- 4. 數據排序列 -->
            <section class="px-4 py-1.5 flex justify-between items-center text-xs text-slate-500">
                <div>找到 <span id="product-count" class="font-bold text-shopee">0</span> 筆商品</div>
                <div class="flex items-center space-x-1">
                    <i class="fa-solid fa-arrow-down-wide-short text-slate-400"></i>
                    <select id="sort-select" class="bg-transparent font-medium text-slate-700 outline-none cursor-pointer">
                        <option value="rate-desc">分潤率：高 → 低</option>
                        <option value="sales-desc">熱銷售出：多 → 少</option>
                        <option value="price-asc">價格：低 → 高</option>
                    </select>
                </div>
            </section>

            <!-- 5. 商品卡片清單 -->
            <section class="px-3 space-y-3 mt-1" id="product-list">
                <!-- 動態注入商品卡片 -->
            </section>

        </main>

        <!-- Toast 提示語 -->
        <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-xs px-4 py-2 rounded-full shadow-lg transition duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-1.5">
            <i class="fa-solid fa-circle-check text-green-400"></i>
            <span id="toast-msg">已成功複製推廣文案！</span>
        </div>

        <!-- 6. 底部導覽列 -->
        <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto z-30 px-6 py-2 flex justify-between items-center text-slate-400">
            <button class="flex flex-col items-center space-y-1 text-shopee">
                <i class="fa-solid fa-compass text-lg"></i>
                <span class="text-[10px] font-medium">選品台</span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-slate-600 transition">
                <i class="fa-solid fa-id-card text-lg"></i>
                <span class="text-[10px] font-medium font-mono"><span id="nav-subid-label">16390210028</span></span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-slate-600 transition">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-medium">推廣設定</span>
            </button>
        </nav>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const mockProducts = [
            {
                id: 101,
                title: '寵物推車手提兩用包 貓狗外出推車 可拆式推車 寵物拉桿包',
                category: 'pet',
                price: 849,
                discountPrice: 849,
                rate: 10.0,
                sales: 530,
                promoters: 50,
                image: 'https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=400&auto=format&fit=crop&q=80',
                shortCode: 's.shopee.tw/3fX9A1B'
            },
            {
                id: 1,
                title: '史上最強防滑拖鞋 室內拖鞋 浴室防滑 軟底耐磨 厚底拖鞋',
                category: 'home',
                price: 180,
                discountPrice: 180,
                rate: 15.0,
                sales: 3200,
                promoters: 120,
                image: 'https://images.unsplash.com/photo-1603808033192-082d6939d3e1?w=400&auto=format&fit=crop&q=80',
                shortCode: 's.shopee.tw/8kL0P3Q'
            },
            {
                id: 2,
                title: '工業級強力防水膠 995透明防水膠 外牆屋頂抓漏 絕緣防水塗料',
                category: 'home',
                price: 169,
                discountPrice: 169,
                rate: 12.0,
                sales: 795,
                promoters: 35,
                image: 'https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=400&auto=format&fit=crop&q=80',
                shortCode: 's.shopee.tw/4mT7Y2W'
            },
            {
                id: 3,
                title: '20W 雙口快充頭 PD充電器 迷你安全旅充頭 Type-C 充電線',
                category: 'appliance',
                price: 199,
                discountPrice: 199,
                rate: 8.0,
                sales: 1500,
                promoters: 88,
                image: 'https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=400&auto=format&fit=crop&q=80',
                shortCode: 's.shopee.tw/6pR1V5Z'
            }
        ];

        let currentCategory = 'all';
        let activeSubID = localStorage.getItem('shopee_subid') || '16390210028';

        const productListEl = document.getElementById('product-list');
        const productCountEl = document.getElementById('product-count');
        const searchInput = document.getElementById('search-input');
        const minPriceInput = document.getElementById('min-price');
        const maxPriceInput = document.getElementById('max-price');
        const minRateInput = document.getElementById('min-rate');
        const minSalesInput = document.getElementById('min-sales');
        const sortSelect = document.getElementById('sort-select');
        const filterPanel = document.getElementById('filter-panel');
        const toggleFilterBtn = document.getElementById('toggle-filter-btn');
        const filterArrow = document.getElementById('filter-arrow');
        const applyFilterBtn = document.getElementById('apply-filter-btn');
        const resetFiltersBtn = document.getElementById('reset-filters');
        const subidInput = document.getElementById('subid-input');
        const saveSubidBtn = document.getElementById('save-subid-btn');
        const navSubidLabel = document.getElementById('nav-subid-label');
        const searchShopeeAppBtn = document.getElementById('search-shopee-app-btn');
        const toastEl = document.getElementById('toast');
        const toastMsgEl = document.getElementById('toast-msg');

        subidInput.value = activeSubID;
        navSubidLabel.textContent = activeSubID;

        saveSubidBtn.addEventListener('click', () => {
            const val = subidInput.value.trim() || '16390210028';
            activeSubID = val;
            localStorage.setItem('shopee_subid', activeSubID);
            navSubidLabel.textContent = activeSubID;
            showToast(`推廣編號已更新: ${activeSubID}`);
            renderProducts();
        });

        function getAffiliateUrl(p) {
            return `https://${p.shortCode}?sub_id=${encodeURIComponent(activeSubID)}`;
        }

        // 開啟蝦皮 App 並跳轉至分潤計畫頁面 (圖四 -> 圖五)
        searchShopeeAppBtn.addEventListener('click', () => {
            const kw = searchInput.value.trim();
            if (kw) {
                // 自動複製關鍵字到剪貼簿，方便貼上
                navigator.clipboard.writeText(kw);
                showToast(`已複製「${kw}」，正在拉起蝦皮分潤計畫...`);
            } else {
                showToast('正在開啟蝦皮 App 分潤計畫...');
            }

            // 嘗試透過分潤專屬 Scheme 或 Universal Link 開啟 App
            window.location.href = `shopee://affiliate`;

            setTimeout(() => {
                window.location.href = `shopee://`;
            }, 1000);
        });

        // 喚起 App 商品頁
        window.openShopeeApp = function(productId) {
            const p = mockProducts.find(item => item.id === productId);
            if (!p) return;

            showToast('正在喚起蝦皮 App...');
            window.location.href = `shopee://`;
        };

        // 一鍵複製文案
        window.copyShareText = function(productId) {
            const p = mockProducts.find(item => item.id === productId);
            if (!p) return;

            const affUrl = getAffiliateUrl(p);
            const shareText = `🔥【熱銷推薦】${p.title}\n💰 優惠價：$${p.discountPrice} (預估分潤 ${p.rate}%)\n👉 搶購連結：${affUrl}\n#推廣編號${activeSubID}`;

            navigator.clipboard.writeText(shareText).then(() => {
                showToast(`已複製帶有編號 ${activeSubID} 的社群文案！`);
            });
        };

        function renderProducts() {
            const searchKw = searchInput.value.trim().toLowerCase();
            const minPrice = parseFloat(minPriceInput.value) || 0;
            const maxPrice = parseFloat(maxPriceInput.value) || Infinity;
            const minRate = parseFloat(minRateInput.value) || 0;
            const minSales = parseFloat(minSalesInput.value) || 0;
            const sortVal = sortSelect.value;

            let filtered = mockProducts.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchKw = !searchKw || p.title.toLowerCase().includes(searchKw);
                const matchPrice = p.discountPrice >= minPrice && p.discountPrice <= maxPrice;
                const matchRate = p.rate >= minRate;
                const matchSales = p.sales >= minSales;

                return matchCat && matchKw && matchPrice && matchRate && matchSales;
            });

            filtered.sort((a, b) => {
                if (sortVal === 'rate-desc') return b.rate - a.rate;
                if (sortVal === 'sales-desc') return b.sales - a.sales;
                if (sortVal === 'price-asc') return a.discountPrice - b.discountPrice;
                return 0;
            });

            productCountEl.textContent = filtered.length;

            if (filtered.length === 0) {
                productListEl.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200 p-6">
                        <i class="fa-solid fa-magnifying-glass text-3xl text-slate-300 mb-2"></i>
                        <p class="text-sm text-slate-500 font-medium">找不到符合條件的商品</p>
                    </div>
                `;
                return;
            }

            productListEl.innerHTML = filtered.map(p => {
                const earnAmount = (p.discountPrice * (p.rate / 100)).toFixed(1);
                return `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex flex-col space-y-2 relative">
                        <div class="flex space-x-3">
                            <div class="w-24 h-24 rounded-xl bg-slate-100 flex-shrink-0 overflow-hidden relative">
                                <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover">
                            </div>

                            <div class="flex-1 flex flex-col justify-between">
                                <h3 class="text-xs font-semibold text-slate-800 line-clamp-2 leading-relaxed">
                                    ${p.title}
                                </h3>
                                
                                <div class="space-y-1">
                                    <div class="text-[11px] text-slate-500">
                                        已售 ${p.sales} ・ 推廣者 ${p.promoters}人
                                    </div>
                                    <div class="flex justify-between items-baseline">
                                        <span class="text-shopee font-bold text-base">$${p.discountPrice}</span>
                                        <span class="text-xs text-shopee font-bold bg-orange-50 px-1.5 py-0.5 rounded">分潤 ${p.rate}% (預估 +$${earnAmount})</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex gap-2">
                            <button onclick="openShopeeApp(${p.id})" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold py-2 rounded-xl transition flex justify-center items-center gap-1 shadow-sm active:scale-[0.98]">
                                <i class="fa-solid fa-bolt"></i> 開啟App
                            </button>
                            <button onclick="copyShareText(${p.id})" class="flex-1 bg-shopee hover:bg-shopee-hover text-white text-xs font-bold py-2 rounded-xl transition flex justify-center items-center gap-1 shadow-sm active:scale-[0.98]">
                                <i class="fa-regular fa-copy"></i> 複製文案
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showToast(msg) {
            toastMsgEl.textContent = msg;
            toastEl.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toastEl.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        document.getElementById('category-tabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;

            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('active', 'bg-shopee', 'text-white', 'shadow-sm');
                b.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            });

            btn.classList.add('active', 'bg-shopee', 'text-white', 'shadow-sm');
            btn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');

            currentCategory = btn.dataset.cat;
            renderProducts();
        });

        let isFilterOpen = false;
        filterPanel.classList.add('hidden');
        toggleFilterBtn.addEventListener('click', () => {
            isFilterOpen = !isFilterOpen;
            if (isFilterOpen) {
                filterPanel.classList.remove('hidden');
                filterArrow.classList.add('rotate-180');
            } else {
                filterPanel.classList.add('hidden');
                filterArrow.classList.remove('rotate-180');
            }
        });

        searchInput.addEventListener('input', renderProducts);
        sortSelect.addEventListener('change', renderProducts);
        applyFilterBtn.addEventListener('click', renderProducts);

        resetFiltersBtn.addEventListener('click', () => {
            searchInput.value = '';
            minPriceInput.value = '';
            maxPriceInput.value = '';
            minRateInput.value = '';
            minSalesInput.value = '';
            sortSelect.value = 'rate-desc';
            renderProducts();
            showToast('已重設篩選條件');
        });

        renderProducts();
    </script>
</body>
</html>
